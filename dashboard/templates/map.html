<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funnel Agent · Live map</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#f6f1e6; --surface:#fffdf7; --surface-2:#f1ead9; --hover:rgba(120,90,30,.05);
      --ink:#332f27; --ink-2:#5f584b; --muted:#9a9081;
      --grid:#e8e0cd; --line:#e6ddc8; --border:rgba(70,55,25,.15); --border-2:rgba(70,55,25,.075);
      --amber:#c8892c; --amber-d:#b07620; --amber-l:#e3b45f; --link:#9a6410; --good:#4a8f52;
      --ocean:#efe8d6; --land:#e2d1a6;
      --shadow:0 1px 2px rgba(80,60,25,.05), 0 2px 7px rgba(80,60,25,.045);
      --r:14px;
    }
    * { box-sizing:border-box; } html,body { margin:0; }
    body { background:radial-gradient(1150px 440px at 82% -12%, rgba(214,168,72,.20), transparent 62%), var(--bg);
      background-attachment:fixed; color:var(--ink); font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
    svg { display:block; }
    .shell { display:flex; min-height:100vh; }
    .sidebar { width:224px; flex:none; border-right:1px solid var(--border); background:var(--surface); padding:22px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; }
    .side-brand { display:flex; align-items:center; gap:9px; font-weight:660; font-size:15px; letter-spacing:-.01em; padding:2px 8px 20px; }
    .side-logo { width:26px; height:26px; border-radius:8px; background:linear-gradient(180deg,var(--amber-l),var(--amber-d)); display:flex; align-items:center; justify-content:center; color:#fff; }
    .side-nav { display:flex; flex-direction:column; gap:3px; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:9px; color:var(--ink-2); text-decoration:none; font-size:13.5px; font-weight:520; }
    .nav-item:hover { background:var(--hover); color:var(--ink); }
    .nav-item.active { background:color-mix(in srgb,var(--amber) 15%,transparent); color:var(--link); font-weight:600; }
    .nav-item svg { width:16px; height:16px; opacity:.9; }
    .side-foot { margin-top:auto; padding:10px 11px 2px; color:var(--muted); font-size:11.5px; display:flex; align-items:center; gap:7px; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--good); }
    @media (max-width:760px){ .shell{ flex-direction:column; } .sidebar{ width:auto; height:auto; position:static; flex-direction:row; align-items:center; padding:12px 14px; } .side-brand{padding:0} .side-nav{flex-direction:row; margin-left:8px} .side-foot{margin-left:auto} }

    .app { flex:1; min-width:0; max-width:1180px; margin:0 auto; padding:30px 30px 72px; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; flex-wrap:wrap; }
    .top h1 { margin:0; font-size:21px; font-weight:640; letter-spacing:-.02em; }
    .top .sub { margin-top:6px; color:var(--muted); font-size:12.5px; }
    .updated { color:var(--muted); font-size:12px; }

    .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
    @media (max-width:700px){ .kpis{ grid-template-columns:1fr; } }
    .tile { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:15px 17px; box-shadow:var(--shadow); }
    .tile .k { font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; }
    .tile .v { font-size:29px; font-weight:660; letter-spacing:-.02em; margin-top:6px; line-height:1; font-variant-numeric:tabular-nums; }
    .tile .v .live-dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--amber); margin-right:8px; vertical-align:middle; }
    .tile .s { margin-top:8px; font-size:11.5px; color:var(--ink-2); }

    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); margin-top:6px; overflow:hidden; box-shadow:var(--shadow); }
    .card > h2 { margin:0; padding:14px 18px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); font-size:12px; font-weight:650; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2); }
    .card > h2 .ic { color:var(--muted); display:flex; }
    .legend { margin-left:auto; display:flex; gap:14px; font-size:11px; color:var(--muted); font-weight:500; letter-spacing:0; text-transform:none; }
    .legend b { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }

    .mapwrap { position:relative; padding:10px 12px 6px; }
    .worldmap { width:100%; height:auto; }
    .ocean { fill:var(--ocean); }
    .land { fill:var(--land); stroke:#d3bf8f; stroke-width:.4; stroke-linejoin:round; }
    .d-dot { fill:var(--amber-d); opacity:.6; }
    .d-live { fill:var(--amber); stroke:#fff8ec; stroke-width:1; }
    .mk { cursor:pointer; }
    .tt { position:absolute; pointer-events:none; background:var(--ink); color:#fff8ec; font-size:11.5px; padding:7px 10px; border-radius:9px; transform:translate(-50%,-118%); white-space:nowrap; opacity:0; transition:opacity .1s; z-index:5; box-shadow:0 6px 18px rgba(60,45,15,.25); }
    .tt b { font-weight:640; } .tt .m { color:#d9c7a0; }

    .listcard { margin-top:20px; }
    .tw { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; padding:11px 16px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; border-bottom:1px solid var(--border); white-space:nowrap; }
    td { padding:11px 16px; border-bottom:1px solid var(--border-2); }
    tr:last-child td { border-bottom:none; }
    tbody tr:hover { background:var(--hover); }
    .who { font-weight:520; } .who.anon { color:var(--muted); font-weight:400; }
    .loc { display:inline-flex; align-items:center; gap:4px; color:var(--ink-2); }
    .chip { display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2); }
    .chip.bofu{ color:#fff9ef; background:var(--amber-d); border-color:var(--amber); }
    .chip.mofu{ color:#8a5712; background:rgba(200,140,40,.24); border-color:rgba(200,140,40,.42); }
    .chip.tofu{ color:#8a6a1e; background:rgba(200,150,50,.16); border-color:rgba(200,150,50,.32); }
    .livetag { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--amber-d); }
    .livetag i { width:7px; height:7px; border-radius:50%; background:var(--amber); display:inline-block; }
    .muted { color:var(--muted); } .num { font-variant-numeric:tabular-nums; }
    .empty { padding:26px 16px; color:var(--muted); text-align:center; }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="side-brand"><span class="side-logo" id="logo"></span> Funnel Agent</div>
    <nav class="side-nav">
      <a class="nav-item" href="/dashboard"><span id="ic-ov"></span> Overview</a>
      <a class="nav-item" href="/insights"><span id="ic-in"></span> Insights</a>
      <a class="nav-item active" href="/map"><span id="ic-mp"></span> Live map</a>
      <a class="nav-item" href="/settings"><span id="ic-se"></span> Settings</a>
    </nav>
    <div class="side-foot"><span class="dot"></span> ENGAGEO</div>
  </aside>

  <main class="app">
    <div class="top">
      <div><h1>Live map</h1><div class="sub">Where your visitors are, worldwide — pulsing dots are on the site right now.</div></div>
      <span class="updated" id="updated"></span>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="card">
      <h2><span class="ic" id="ic-globe"></span> World
        <span class="legend"><span><b style="background:var(--amber)"></b>live now</span><span><b style="background:var(--amber-d);opacity:.6"></b>been here</span></span></h2>
      <div class="mapwrap">
        <svg class="worldmap" id="map" viewBox="0 8 1000 424" preserveAspectRatio="xMidYMid meet">
          <rect class="ocean" x="0" y="0" width="1000" height="500"/>
          <path class="land" id="land" d=""/>
          <g id="dots"></g>
        </svg>
        <div class="tt" id="tt"></div>
      </div>
    </div>

    <div class="card listcard">
      <h2><span class="ic" id="ic-list"></span> Located visitors <span style="margin-left:auto;font-size:11px;color:var(--muted);font-weight:600" id="listn"></span></h2>
      <div class="tw"><table id="vtable"><thead><tr>
        <th>Visitor</th><th>Location</th><th>Stage</th><th>Status</th><th>Seen</th>
      </tr></thead><tbody></tbody></table></div>
    </div>
  </main>
</div>

<script src="/world.js"></script>
<script>
  const P = {
    grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    bars:'<path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6" rx="1"/><rect x="12" y="7" width="3" height="10" rx="1"/><rect x="17" y="14" width="3" height="3" rx="1"/>',
    globe:'<circle cx="12" cy="12" r="9"/><path d="M2 12h20"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/>',
    sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
    spark:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>', pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
    list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  };
  const svg=(n,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]||''}</svg>`;
  const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt=n=>new Intl.NumberFormat().format(n||0);
  const get=async p=>{const r=await fetch(p); if(!r.ok) throw new Error(p+" → "+r.status); return r.json();};
  // A timestamp with no offset is UTC here; without the Z, JS would read it as local.
  const parseTs=s=>{ if(!s) return null; const d=new Date(/([zZ]|[+-]\d{2}:?\d{2})$/.test(s)?s:s+"Z"); return isNaN(d.getTime())?null:d; };
  const agoText=s=>{ const t=parseTs(s); if(!t) return '—'; const d=Math.max(0,Math.round((Date.now()-t.getTime())/1000)); return d<60?d+"s ago":(d<3600?Math.round(d/60)+"m ago":Math.round(d/3600)+"h ago"); };
  const stageClass=s=>({TOFU:'tofu',MOFU:'mofu',BOFU:'bofu'}[s]||'');
  // Show the finest detail available; a GPS fix carries street + neighbourhood,
  // an IP only a city. The ± suffix says which one you're looking at.
  const locText=v=>{
    const parts=[v.street,v.district,v.city,v.country].filter(Boolean);
    const base=parts.length?parts.slice(0,3).join(", "):(v.country||"—");
    if(v.location_source!=='gps') return base;
    return base+(v.accuracy_m!=null
      ? ` (±${v.accuracy_m<1000?Math.round(v.accuracy_m)+"m":(v.accuracy_m/1000).toFixed(1)+"km"})` : " (exact)");
  };
  const proj=(lng,lat)=>[ (lng+180)*1000/360, (90-lat)*500/180 ];

  function icons(){
    document.getElementById("logo").innerHTML=svg("spark",14);
    document.getElementById("ic-ov").innerHTML=svg("grid",16);
    document.getElementById("ic-in").innerHTML=svg("bars",16);
    document.getElementById("ic-mp").innerHTML=svg("globe",16);
    document.getElementById("ic-se").innerHTML=svg("sliders",16);
    document.getElementById("ic-globe").innerHTML=svg("globe",15);
    document.getElementById("ic-list").innerHTML=svg("list",15);
    document.getElementById("land").setAttribute("d", window.WORLD_LAND||"");
  }

  let VIS=[];
  function renderKpis(d){
    document.getElementById("kpis").innerHTML =
      `<div class="tile"><div class="k">Live now</div><div class="v"><span class="live-dot"></span>${fmt(d.live)}</div><div class="s">on the site right now</div></div>
       <div class="tile"><div class="k">Located visitors</div><div class="v">${fmt(d.total)}</div><div class="s">with a geo fix</div></div>
       <div class="tile"><div class="k">Countries</div><div class="v">${fmt(d.countries)}</div><div class="s">distinct countries</div></div>`;
  }
  function renderDots(){
    const g=document.getElementById("dots");
    g.innerHTML = VIS.map((v,i)=>{
      if(v.lat==null||v.lng==null) return "";
      const [x,y]=proj(v.lng,v.lat);
      if(v.live){
        return `<g class="mk" data-i="${i}">
          <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="var(--amber)" opacity="0.4">
            <animate attributeName="r" values="4;13" dur="1.9s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.5;0" dur="1.9s" repeatCount="indefinite"/></circle>
          <circle class="d-live" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.4"/></g>`;
      }
      return `<circle class="d-dot mk" data-i="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"/>`;
    }).join("");
  }
  function renderList(){
    const tb=document.querySelector("#vtable tbody");
    document.getElementById("listn").textContent = VIS.length+" located";
    tb.innerHTML = VIS.slice(0,200).map(v=>{
      const label=v.name||v.email; const named=!!label;
      return `<tr>
        <td><span class="who ${named?'':'anon'}">${named?esc(label):'Anonymous'}</span></td>
        <td><span class="loc">${svg('pin',12)} ${esc(locText(v))}</span></td>
        <td>${v.funnel_stage?`<span class="chip ${stageClass(v.funnel_stage)}">${esc(v.funnel_stage)}</span>`:'<span class="muted">—</span>'}</td>
        <td>${v.live?'<span class="livetag"><i></i>live</span>':'<span class="muted">—</span>'}</td>
        <td class="muted num">${agoText(v.last_seen_at)}</td>
      </tr>`;
    }).join("") || `<tr><td class="empty" colspan="5">No located visitors yet — geo fills in as people browse your site.</td></tr>`;
  }

  // tooltip (event delegation on the dots group)
  const tt=document.getElementById("tt");
  function bindHover(){
    const g=document.getElementById("dots"), wrap=document.querySelector(".mapwrap"), map=document.getElementById("map");
    g.addEventListener("mouseover", e=>{
      const t=e.target.closest("[data-i]"); if(!t) return;
      const v=VIS[+t.dataset.i]; if(!v) return;
      const label=v.name||v.email||"Anonymous";
      tt.innerHTML=`<b>${esc(label)}</b><br><span class="m">${esc(locText(v))}</span>`+
        (v.funnel_stage?` · ${esc(v.funnel_stage)}`:'')+`<br><span class="m">${v.live?'live now':agoText(v.last_seen_at)}</span>`;
      tt.style.opacity=1;
    });
    g.addEventListener("mousemove", e=>{
      const r=wrap.getBoundingClientRect();
      tt.style.left=(e.clientX-r.left)+"px"; tt.style.top=(e.clientY-r.top)+"px";
    });
    g.addEventListener("mouseout", ()=>{ tt.style.opacity=0; });
  }

  async function load(){
    try{
      const d=await get("/api/map");
      VIS=d.visitors||[];
      renderKpis(d); renderDots(); renderList();
      document.getElementById("updated").textContent="updated "+new Date().toLocaleTimeString();
    }catch(e){
      document.getElementById("kpis").innerHTML=`<div class="tile" style="grid-column:1/-1"><div class="k" style="color:#c24a33">Error</div><div class="s">${esc(e.message)}</div></div>`;
    }
  }
  icons(); bindHover(); load(); setInterval(load, 3000);
</script>
</body>
</html>
