# guardrails.yaml — decision guardrail parameters (Layer 3).
#
# Read by decision/guardrails.py, which validates EVERY decision before it is
# accepted. No guardrail logic is hardcoded in Python — thresholds live here.

version: 1

# Timezone used to evaluate the send window against a decision's send_at.
timezone: UTC

allowed_actions: [send_email, send_whatsapp, wait, handoff_human]
outreach_actions: [send_email, send_whatsapp]   # actions that count toward the rate limit

# Max outreach actions accepted per lead within a rolling window.
rate_limit:
  max_outreach: 2
  window_days: 7

# One approved template per funnel stage means a second message at the SAME
# stage delivers copy the lead has already read. With this on, a lead is nudged
# once per stage and earns a new nudge only by moving (TOFU -> MOFU -> BOFU).
# The rate limit above is a weekly ceiling; this is the "don't repeat yourself".
one_nudge_per_stage: true

# Sends may only be scheduled within [start_hour, end_hour) local time.
send_window:
  start_hour: 9
  end_hour: 21

# Which channel each send action must target.
action_channels:
  send_email: email
  send_whatsapp: whatsapp

# An inbound message that is EXACTLY one of these — case, spacing and trailing
# punctuation ignored — is treated as an opt-out and silences the channel.
# Matched whole, never as a substring: "stop losing patients to missed calls"
# is a sentence about the product, not a request to be left alone.
opt_out_keywords:
  [stop, stop all, stopall, unsubscribe, opt out, opt-out, remove me, cancel, end, quit]

# Consent flag (a leads column) required for each channel.
channel_consent:
  email: email_opt_in
  whatsapp: whatsapp_opt_in

# Required decision fields per action (action + reasoning are always required).
required_fields:
  send_email: [channel, message, send_at]
  send_whatsapp: [channel, message, send_at]
  wait: [send_at]
  handoff_human: []
