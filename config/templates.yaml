# templates.yaml — suggested message copy per funnel stage / channel (Layer 3).
#
# The decision engine is shown the template(s) for the lead's stage and returns a
# final, personalized `message`. Copy lives here, never in prompts or code.
# Placeholders like {topic}/{objection} are filled by the model from persona/behavior.

version: 1

email:
  TOFU: |
    Subject: A quick read on {topic}

    Hi there — thanks for checking out our guide. If you're exploring {topic},
    here are two more resources our readers found useful. No pressure — just
    helpful reading when you have a minute.
  MOFU: |
    Subject: Comparing your options?

    Hi — looks like you've been weighing things up. Here's an honest side-by-side
    of how we compare, plus answers to the questions buyers ask most. Happy to
    point you to a customer in your space if that helps.
  BOFU: |
    Subject: Ready when you are

    Hi — you were close to getting started. If {objection} is the sticking point,
    I can help sort it out. Want me to set you up, or answer any last questions?

whatsapp:
  MOFU: |
    Hi! Saw you were weighing this up. Want me to run your clinic's numbers and
    show what missed calls are actually costing you a month? Takes 2 minutes.
  BOFU: |
    Hi! You were mid-signup earlier — anything I can help with to get you across
    the line? Happy to walk you through it.

# --- WhatsApp templates (Meta-approved names) --------------------------------
# A business-initiated WhatsApp message MUST use a template Meta has approved;
# free text only delivers inside the 24-hour window that opens when the CONTACT
# messages you. So every message the agent starts — the welcome and each stage
# nudge — names a template here.
#
# `name` and `lang` must match the approved template exactly. `params` lists the
# lead fields that fill {{1}}, {{2}}, … in the template body, in order. Change
# these without a deploy from the Settings page or by editing this file.
#
# `category` must match the category Meta approved the template under, because
# it decides who may receive it. MARKETING may only go to someone who ticked the
# opt-in box. UTILITY answers a thing the person just did, so handing over their
# number for that purpose is the consent — requiring a marketing tick as well
# would block the message from the very people it exists to reach.
#
# Getting this wrong is a policy breach, not a bug: declaring a marketing
# template as utility here would send promotions to people who never opted in.
whatsapp_templates:
  # `body` is what the contact actually receives. Meta sends the copy IT has
  # approved regardless of what is written here, so this field changes nothing
  # about delivery — it exists so the dashboard, the message thread and the
  # audit log show the real message rather than free text that was never sent.
  # Keep it identical to the body in WhatsApp Manager; {{1}} is filled from
  # `params` below, in order.
  welcome:
    category: utility
    name: engageo_welcome
    lang: en
    params: [name]
    body: >
      Hi {{1}}, thanks for choosing Engageo! We help clinics stop losing patients
      to missed calls and slow replies. We'll be in touch shortly.
  TOFU:
    category: marketing
    name: engageo_nudge_tofu
    lang: en
    params: [name]
    body: >
      Hi {{1}}! Thanks for stopping by Engageo. Most clinics we speak to are
      losing 3-4 patients a week to calls nobody picked up. Want the short guide
      on where those go?
  MOFU:
    # Named without the 'nudge_' the others use — matches what is approved in
    # WhatsApp Manager, which is the name Graph checks.
    name: engageo_mofu
    lang: en
    params: [name]
    body: >
      Hi {{1}}! Saw you were weighing this up. Want me to run your clinic's
      numbers and show what missed calls are actually costing you a month?
      Takes 2 minutes.
  BOFU:
    category: marketing
    name: engageo_nudge_bofu
    lang: en
    params: [name]
    body: >
      Hi {{1}}! You were mid-signup earlier — anything I can help with to get
      you across the line? Happy to walk you through it.
