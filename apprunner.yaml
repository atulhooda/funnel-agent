# AWS App Runner — source (GitHub) deploy, managed Python runtime.
# No Docker/ECR needed: App Runner clones the repo, pip-installs, and runs the app.
# Secrets (DATABASE_URL, GEMINI_API_KEY, TRACK_WRITE_KEY, ...) are set on the
# App Runner service (console/CLI), NOT here — this file is public in the repo.
version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  runtime-version: 3.11
  command: sh entrypoint.sh
  network:
    port: 8080
  env:
    - name: PORT
      value: "8080"
